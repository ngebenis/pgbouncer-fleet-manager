<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FDF6EA"/>
      <stop offset="100%" stop-color="#F3E4C8"/>
    </radialGradient>
    <radialGradient id="plateShadow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3ECDD"/>
    </linearGradient>
    <linearGradient id="pempekBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C77C"/>
      <stop offset="55%" stop-color="#D9A94F"/>
      <stop offset="100%" stop-color="#BE8838"/>
    </linearGradient>
    <linearGradient id="cukoBowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A3418"/>
      <stop offset="100%" stop-color="#5C210D"/>
    </linearGradient>
    <radialGradient id="cukoSurface" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#A6451F"/>
      <stop offset="100%" stop-color="#6E260F"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="url(#bg)"/>

  <!-- subtle batik-inspired corner motifs (kawung-like repeating ovals) -->
  <g opacity="0.16" fill="none" stroke="#9C6B2E" stroke-width="2.5">
    <g transform="translate(70,70)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(130,40)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(930,70)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(870,40)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(70,930)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(130,960)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(930,930)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(870,960)">
      <ellipse cx="0" cy="-16" rx="13" ry="20"/>
      <ellipse cx="0" cy="16" rx="13" ry="20"/>
      <ellipse cx="-16" cy="0" rx="20" ry="13"/>
      <ellipse cx="16" cy="0" rx="20" ry="13"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
  </g>

  <!-- plate shadow -->
  <ellipse cx="500" cy="470" rx="330" ry="330" fill="url(#plateShadow)"/>

  <!-- plate -->
  <circle cx="500" cy="440" r="320" fill="url(#plateFace)" stroke="#E4D6B4" stroke-width="3"/>
  <circle cx="500" cy="440" r="270" fill="none" stroke="#E9DCC0" stroke-width="2"/>

  <!-- pempek pieces: lenjer-style ovals arranged around plate -->
  <g>
    <g transform="translate(395,355) rotate(-8)">
      <ellipse rx="95" ry="46" fill="url(#pempekBody)" stroke="#9C6B2E" stroke-width="3"/>
      <ellipse cx="-18" cy="-14" rx="46" ry="14" fill="#FFFFFF" opacity="0.28"/>
    </g>
    <g transform="translate(600,370) rotate(10)">
      <ellipse rx="95" ry="46" fill="url(#pempekBody)" stroke="#9C6B2E" stroke-width="3"/>
      <ellipse cx="-18" cy="-14" rx="46" ry="14" fill="#FFFFFF" opacity="0.28"/>
    </g>
    <g transform="translate(410,470) rotate(4)">
      <ellipse rx="95" ry="46" fill="url(#pempekBody)" stroke="#9C6B2E" stroke-width="3"/>
      <ellipse cx="-18" cy="-14" rx="46" ry="14" fill="#FFFFFF" opacity="0.28"/>
    </g>
    <!-- kapal selam piece, cut open revealing egg -->
    <g transform="translate(560,485) rotate(-6)">
      <ellipse rx="100" ry="50" fill="url(#pempekBody)" stroke="#9C6B2E" stroke-width="3"/>
      <ellipse cx="-20" cy="-16" rx="42" ry="13" fill="#FFFFFF" opacity="0.22"/>
      <ellipse cx="18" ry="34" rx="30" fill="#F6E27A" stroke="#D9A94F" stroke-width="2.5"/>
      <ellipse cx="18" ry="20" rx="14" fill="#F2C94C"/>
    </g>
  </g>

  <!-- cucumber garnish, layered on top of pempek edges -->
  <g>
    <g transform="translate(330,322) rotate(-18)">
      <ellipse rx="28" ry="17" fill="#CDE0A8" stroke="#7FA04E" stroke-width="2.5"/>
      <ellipse rx="15" ry="9" fill="#EEF5DE"/>
      <circle cx="-9" cy="-3" r="1.6" fill="#7FA04E"/>
      <circle cx="9" cy="3" r="1.6" fill="#7FA04E"/>
      <circle cx="0" cy="0" r="1.6" fill="#7FA04E"/>
    </g>
    <g transform="translate(672,338) rotate(24)">
      <ellipse rx="26" ry="16" fill="#CDE0A8" stroke="#7FA04E" stroke-width="2.5"/>
      <ellipse rx="14" ry="8" fill="#EEF5DE"/>
      <circle cx="-8" cy="-3" r="1.5" fill="#7FA04E"/>
      <circle cx="8" cy="3" r="1.5" fill="#7FA04E"/>
    </g>
    <g transform="translate(355,500) rotate(-30)">
      <ellipse rx="24" ry="15" fill="#CDE0A8" stroke="#7FA04E" stroke-width="2.5"/>
      <ellipse rx="13" ry="8" fill="#EEF5DE"/>
    </g>
  </g>

  <!-- cuko bowl, lower-right of plate -->
  <g transform="translate(600,560)">
    <ellipse cx="0" cy="14" rx="92" ry="30" fill="#000" opacity="0.10"/>
    <path d="M -90,-10 Q -90,46 0,46 Q 90,46 90,-10 Q 90,-34 0,-34 Q -90,-34 -90,-10 Z" fill="url(#cukoBowl)"/>
    <ellipse cx="0" cy="-10" rx="88" ry="26" fill="url(#cukoSurface)"/>
    <ellipse cx="0" cy="-10" rx="88" ry="26" fill="none" stroke="#3E1509" stroke-width="3"/>
    <!-- ebi + cabai flecks -->
    <circle cx="-35" cy="-14" r="3.5" fill="#E8C77E"/>
    <circle cx="-18" cy="-4" r="3" fill="#E8C77E"/>
    <circle cx="10" cy="-16" r="3.5" fill="#E8C77E"/>
    <circle cx="34" cy="-6" r="3" fill="#E8C77E"/>
    <circle cx="-5" cy="-2" r="4" fill="#C0392B"/>
    <circle cx="48" cy="-14" r="4" fill="#C0392B"/>
    <circle cx="-48" cy="-2" r="3.5" fill="#C0392B"/>
  </g>

  <!-- drizzle from bowl onto nearby pempek -->
  <path d="M 540,520 Q 555,505 575,500" fill="none" stroke="#8A3418" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="580" cy="498" r="4" fill="#8A3418" opacity="0.8"/>

  <!-- small chili + ebi accents scattered on plate rim -->
  <g transform="translate(265,560) rotate(25)">
    <path d="M0,0 Q10,-28 2,-46 Q20,-30 14,-6 Q24,-14 20,2 Q10,10 0,0 Z" fill="#C0392B"/>
    <path d="M0,0 Q-6,10 2,14" fill="none" stroke="#5B8C3E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="500" y="845" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#4A2F17" font-weight="bold">Pempek Palembang</text>
  <text x="500" y="882" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#8A6A3E" letter-spacing="2">SUMATERA SELATAN · INDONESIA</text>

  <!-- thin gold ring accent -->
  <circle cx="500" cy="440" r="345" fill="none" stroke="#C9973E" stroke-width="1.5" opacity="0.5"/>
</svg>
